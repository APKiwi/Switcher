name: scratch-check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scratch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sh Scripts/check-scratch.sh --tree
      - run: sh Scripts/tests/check-scratch.test.sh
