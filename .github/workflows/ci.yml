name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check contributor instruction harness
        run: |
          sh Scripts/check-agent-instructions.sh --tree
          sh Scripts/tests/check-agent-instructions.test.sh
          sh Scripts/tests/agent-instruction-guard.test.sh
      - name: Build
        run: swift build --disable-sandbox
      - name: Test kernels
        run: swift run --disable-sandbox SwitcherKernelsTests
